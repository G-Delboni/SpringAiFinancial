spring.application.name=FinancialAI
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.options.model=nvidia/nemotron-3-ultra-550b-a55b:free
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro, \
  conta com descrições de eventos financeiros. \
  As frases geralmente contem \
  - Valor gasto em reais \
  - Uma ação (Gastei, comprei, paguei)\
  - Um local ou atividade (comércio, padaria, compra online,etc).